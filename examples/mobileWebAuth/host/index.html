<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example Wallet — mobile-web-auth host</title>
  </head>
  <body>
    <h1>Example Wallet</h1>
    <p>This is the web "host" of the mobile-web-auth example.</p>
    <ul>
      <li>Discovery: <code>/.well-known/urpc/host.json</code></li>
      <li>Authorization: <code>/auth/mobile</code></li>
    </ul>
    <p>
      Open the Expo consumer app, tap <strong>Connect wallet</strong>, then approve the request on
      the page that opens.
    </p>
  </body>
</html>

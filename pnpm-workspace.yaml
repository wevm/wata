allowBuilds:
  '@reown/appkit': false
  esbuild: true
  msgpackr-extract: false
  sharp: true
  workerd: true

blockExoticSubdeps: true

catalog:
  '@changesets/cli': ^2.31.0
  '@hono/node-server': ^1.13.7
  '@noble/ciphers': ^2.2.0
  '@noble/hashes': ^2.2.0
  '@types/node': ^25.6.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  hono: ^4.6.14
  react: ^19.0.0
  react-dom: ^19.0.0
  '@vitest/coverage-v8': 4.1.5
  '@walletconnect/ethereum-provider': ^2.23.9
  ox: ~0.14.20
  playwright: ^1.60.0
  typescript: ^5.9.3
  vp: npm:vite-plus@~0.1.20
  zile: ^0.0.25
  zod: ^4.4.3

minimumReleaseAge: 1440

overrides:
  wata: workspace:*
  # cuer passes `border: 0` (raw grid; it draws its own quiet zone); qr@0.6 rejects it.
  cuer>qr: 0.5.5

minimumReleaseAgeExclude:
  - regen-ui
  - vite-plus
  - vp
  - zile

nodeOptions: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

packages:
  - .
  - examples/**
  - playgrounds/*
  - playgrounds/mobileLink/*

shellEmulator: true

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@noble/curves'
  - '@noble/hashes'
  - reselect
  - semver
  - slow-redact

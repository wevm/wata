name: Verify
on:
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check code
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Cache TypeScript build info
        uses: actions/cache@v4
        with:
          path: |
            src/**/*.tsbuildinfo
            test/**/*.tsbuildinfo
            examples/**/*.tsbuildinfo
            playgrounds/**/*.tsbuildinfo
            !**/node_modules/**
          key: typescript-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            typescript-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Check types
        run: pnpm check:types

  test-node:
    name: Test (node)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Run node tests
        run: pnpm test:node --bail=1
        env:
          CI: true

  test-browser:
    name: Test (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          PW_VERSION=$(node -p "require('playwright/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ runner.arch }}-headless-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        # The hosted Ubuntu image includes Chromium's shared libraries.
        run: pnpm exec playwright install --only-shell chromium

      - name: Run browser tests
        run: pnpm test:browser --bail=1
        env:
          CI: true

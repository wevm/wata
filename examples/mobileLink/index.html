<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spendlet and Ironbank</title>
    <style>
      body {
        color: #111827;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
      }

      main {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        padding: 24px;
      }

      section {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 18px;
      }

      button {
        font: inherit;
        margin-right: 8px;
      }

      .panel {
        background: #f8fafc;
        border-radius: 8px;
        margin: 16px 0;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Spendlet</h1>
        <p>Securely connect Ironbank to show your account balance and recent activity.</p>
        <button id="connect" type="button">Connect Ironbank</button>
        <p id="spendlet-status">Ready</p>
        <div id="spendlet-result" class="panel"></div>
      </section>
      <section>
        <h1>Ironbank</h1>
        <p>Review what Spendlet wants to access before approving.</p>
        <div id="ironbank-request" class="panel"></div>
        <button id="allow" type="button">Allow access</button>
        <button id="deny" type="button">Deny</button>
        <p id="ironbank-status">Ready for Spendlet</p>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
